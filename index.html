
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteúdo Exclusivo 18+</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body, html {
    height: 100%;
    overflow: hidden;
}

/* Background com blur */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');
    background-size: cover;
    background-position: center;
    filter: blur(8px);
    transform: scale(1.1);
    z-index: -2;
}

/* Overlay escuro */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* Conteúdo central */
.container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    color: white;
    flex-direction: column;
}

.container h1 {
    font-size: 3rem;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.container p {
    font-size: 1.2rem;
    margin-bottom: 30px;
    max-width: 500px;
}

/* Botão destaque */
.btn {
    padding: 15px 40px;
    font-size: 1.2rem;
    background: linear-gradient(45deg, #ff0057, #ff7b00);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
    box-shadow: 0 10px 25px rgba(255, 0, 87, 0.4);
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 35px rgba(255, 0, 87, 0.6);
}

/* Responsivo */
@media (max-width: 768px) {
    .container h1 {
        font-size: 2rem;
    }
    .container p {
        font-size: 1rem;
    }
    .btn {
        padding: 12px 30px;
        font-size: 1rem;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">
    <h1>ACESSO EXCLUSIVO 18+</h1>
    <p>Conteúdo premium para maiores de 18 anos. Clique abaixo para liberar seu acesso imediato.</p>
    <button class="btn" onclick="comprar()">QUERO ACESSAR AGORA</button>
</div>

<script>
function comprar() {
    alert("Redirecionando para a página de pagamento...");
    // window.location.href = "https://seulinkdepagamento.com";
}
</script>

</body>
</html>
